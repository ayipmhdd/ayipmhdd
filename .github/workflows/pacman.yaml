name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Paksa SEMUA elemen rect non-hijau menjadi Dark Mode
      - name: force brute-force dark mode on all SVG rects
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET

          file_path = 'dist/pacman-contribution-graph.svg'
          
          # Biar namespace SVG tetap utuh
          ET.register_namespace('', 'http://www.w3.org/2000/svg')
          tree = ET.parse(file_path)
          root = tree.getroot()

          # Daftar warna hijau kontribusi GitHub agar TIDAK ikut terhapus
          green_colors = ['#216e39', '#30a14e', '#40c463', '#9be9a8', 'rgb(33, 110, 57)', 'rgb(48, 161, 78)', 'rgb(64, 196, 99)', 'rgb(155, 233, 168)']

          for elem in root.iter():
              tag = elem.tag.split('}')[-1] if '}' in elem.tag else elem.tag
              
              # PROSES KOTAK-KOTAK (<rect>)
              if tag == 'rect':
                  fill_val = elem.get('fill', '').lower()
                  style_val = elem.get('style', '').lower()
                  
                  # Cek apakah kotak ini BUKAN kotak hijau kontribusi
                  is_green = any(g in fill_val for g in green_colors) or any(g in style_val for g in green_colors)
                  
                  if not is_green:
                      # Paksa warna isi dan border jadi abu-abu gelap
                      elem.set('fill', '#161b22')
                      elem.set('stroke', '#0d1117')
                      if 'style' in elem.attrib:
                          elem.attrib['style'] = 'fill: #161b22 !important; stroke: #0d1117 !important;'

              # PROSES GARIS LABIRIN (<path> / <line>)
              elif tag in ['path', 'line']:
                  stroke_val = elem.get('stroke', '').lower()
                  # Jika bukan garis hijau/transparan, ubah jadi Biru Neon Pac-Man menyala!
                  if stroke_val != 'none':
                      elem.set('stroke', '#388bfd')
                      elem.set('stroke-width', '2')

              # PROSES TEKS BULAN/HARI (<text>)
              elif tag == 'text':
                  elem.set('fill', '#c9d1d9')

          tree.write(file_path, encoding='utf-8', xml_declaration=True)
          "

      # 3. Push Hasil SVG
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
