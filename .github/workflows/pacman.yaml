name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Sapu Bersih Semua Elemen SVG Kotak-Kotak Jadi Dark Mode
      - name: convert SVG to dark mode using python XML
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET

          file_path = 'dist/pacman-contribution-graph.svg'
          
          # Register namespace agar SVG tidak rusak
          ET.register_namespace('', 'http://www.w3.org/2000/svg')
          tree = ET.parse(file_path)
          root = tree.getroot()

          # Warna putih / abu-abu terang yang mau diubah ke dark mode
          light_colors = ['#ffffff', '#fff', 'white', '#ebedf0', '#f0f0f0', '#eeeeee', '#e1e4e8', '#d1d5da']

          for elem in root.iter():
              # 1. Ubah warna fill jika terdeteksi warna putih/terang
              fill = elem.get('fill', '').lower()
              style = elem.get('style', '').lower()
              
              if any(c in fill for c in light_colors) or any(c in style for c in light_colors):
                  elem.set('fill', '#161b22')
                  if 'style' in elem.attrib:
                      # Timpa style inline jika ada
                      elem.attrib['style'] = 'fill: #161b22; stroke: #0d1117;'

              # 2. Paksa border kotak-kotak kecil (stroke) jadi gelap (#0d1117)
              stroke = elem.get('stroke', '').lower()
              if any(c in stroke for c in light_colors):
                  elem.set('stroke', '#0d1117')

              # 3. Ubah garis labirin (path/line) hitam/pucat jadi Biru Neon (#388bfd) & tebal
              if elem.tag.endswith(('path', 'line')):
                  elem.set('stroke', '#388bfd')
                  elem.set('stroke-width', '2')

              # 4. Ubah warna teks bulan & hari (Jan, Feb, Mon) jadi abu-abu terang (#c9d1d9)
              if elem.tag.endswith('text'):
                  elem.set('fill', '#c9d1d9')

          tree.write(file_path, encoding='utf-8', xml_declaration=True)
          "

      # 3. Push hasil SVG
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
