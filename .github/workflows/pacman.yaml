name: Generate Pacman Contribution Graph

on:
  schedule:
    # Menjalankan setiap hari pukul 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Generate Pacman Eating Contributions
      # Menggunakan versi v1.0.0 yang lebih stabil
      - name: generate-pacman-svg
        uses: shaoxiongruan/pacman-contribution-graph@v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}

      # Push file ke branch output
      - name: push pacman.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
