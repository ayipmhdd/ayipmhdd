name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man Bawaan
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Re-engineer Warna SVG untuk Dark Mode secara Presisi
      - name: precision dark mode conversion
        run: |
          python3 -c "
          import re

          file_path = 'dist/pacman-contribution-graph.svg'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # --- 1. UBAH KOTAK-KOTAK KECIL KOSONG (DAY) KE DARK MODE (#161b22) ---
          # Tangkap semua variasi warna putih & abu-abu terang (Hex & RGB)
          light_patterns = r'(#ffffff|#fff|#ebedf0|#f0f0f0|#eeeeee|#e1e4e8|#d1d5da|white|rgb\(235,\s*237,\s*240\)|rgb\(240,\s*240,\s*240\)|rgb\(255,\s*255,\s*255\))'
          
          # Timpa nilai 'fill' dan 'stroke' dari semua kotak terang
          content = re.sub(r'fill=[\"\']' + light_patterns + r'[\"\']', 'fill=\"#161b22\"', content, flags=re.IGNORECASE)
          content = re.sub(r'stroke=[\"\']' + light_patterns + r'[\"\']', 'stroke=\"#0d1117\"', content, flags=re.IGNORECASE)
          content = re.sub(r'fill:\s*' + light_patterns, 'fill: #161b22', content, flags=re.IGNORECASE)
          content = re.sub(r'stroke:\s*' + light_patterns, 'stroke: #0d1117', content, flags=re.IGNORECASE)

          # --- 2. PERTEGAS GARIS LABIRIN PAC-MAN (#187bcd) ---
          # Cari garis labirin (stroke hitam/gelap atau stroke polos) dan ubah jadi Biru Neon Pac-Man
          content = re.sub(r'stroke=[\"\']#(000000|000|333333|222222|111111)[\"\']', 'stroke=\"#187bcd\" stroke-width=\"1.8\"', content, flags=re.IGNORECASE)
          content = re.sub(r'stroke:\s*#(000000|000|333333|222222|111111)', 'stroke: #187bcd; stroke-width: 1.8px', content, flags=re.IGNORECASE)

          # --- 3. UBAH TEKS BULAN/HARI BLA-BLA-BLA BIKIN TERANG (#c9d1d9) ---
          content = re.sub(r'<text([^>]+)fill=[\"\']#(000000|000|333333)[\"\']', r'<text\1fill=\"#c9d1d9\"', content, flags=re.IGNORECASE)

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      # 3. Push File SVG yang Sudah Disesuaikan ke Branch Output
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
