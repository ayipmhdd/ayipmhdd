name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Generate Pacman eating contribution dots with ghosts animation
      - name: generate-pacman-svg
        uses: Ryuno-Ki/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Push file hasil generate ke branch output
      - name: push pacman.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
