name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man Bawaan
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Bedah warna SVG menggunakan Python Script (Anti-Sanitize GitHub)
      - name: convert SVG to dark mode using python
        run: |
          python3 -c "
          import re

          file_path = 'dist/pacman-contribution-graph.svg'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # Replace warna background canvas putih & kotak-kotak terang ke dark mode (#161b22 / #0d1117)
          content = re.sub(r'fill=[\"\']#(ffffff|FFF|ebedf0|f0f0f0|eeeeee)[\"\']', 'fill=\"#161b22\"', content, flags=re.IGNORECASE)
          content = re.sub(r'stroke=[\"\']#(ffffff|FFF|ebedf0|e1e4e8|d1d5da)[\"\']', 'stroke=\"#0d1117\"', content, flags=re.IGNORECASE)

          # Bikin garis labirin hitam/pucat jadi Biru Neon (#388bfd) & tebal
          content = re.sub(r'stroke=[\"\']#(000000|000|333333|666666)[\"\']', 'stroke=\"#388bfd\" stroke-width=\"2\"', content, flags=re.IGNORECASE)

          # Ubah warna teks bulan/hari (Jan, Feb, Mon) jadi abu-abu terang (#c9d1d9)
          content = re.sub(r'fill=[\"\']#(000000|000)[\"\']', 'fill=\"#c9d1d9\"', content, flags=re.IGNORECASE)

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      # 3. Push Hasil SVG yang Sudah Gelap ke Branch Output
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
