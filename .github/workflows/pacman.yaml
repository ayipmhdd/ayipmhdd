name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Sapu bersih CSS & Atribut dengan Python Text Replacement
      - name: convert SVG to dark mode using python regex
        run: |
          python3 -c "
          import re

          file_path = 'dist/pacman-contribution-graph.svg'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # 1. Timpa warna putih/terang pada CSS class (.day, .ContributionCalendar-day, dll)
          content = re.sub(r'fill:\s*#(ffffff|fff|ebedf0|f0f0f0|eeeeee|e1e4e8|d1d5da)', 'fill: #161b22', content, flags=re.IGNORECASE)
          content = re.sub(r'fill:\s*white', 'fill: #161b22', content, flags=re.IGNORECASE)
          content = re.sub(r'stroke:\s*#(ffffff|fff|ebedf0|e1e4e8|d1d5da)', 'stroke: #0d1117', content, flags=re.IGNORECASE)

          # 2. Timpa atribut fill & stroke pada tag XML
          content = re.sub(r'fill=[\"\']#(ffffff|fff|ebedf0|f0f0f0|eeeeee)[\"\']', 'fill=\"#161b22\"', content, flags=re.IGNORECASE)
          content = re.sub(r'fill=[\"\']white[\"\']', 'fill=\"#161b22\"', content, flags=re.IGNORECASE)
          content = re.sub(r'stroke=[\"\']#(ffffff|fff|ebedf0|e1e4e8|d1d5da)[\"\']', 'stroke=\"#0d1117\"', content, flags=re.IGNORECASE)
          content = re.sub(r'stroke=[\"\']white[\"\']', 'stroke=\"#0d1117\"', content, flags=re.IGNORECASE)

          # 3. Ubah garis labirin jadi Biru Neon menyala (#388bfd)
          content = re.sub(r'stroke=[\"\']#(000000|000|333333|666666|cccccc|ccc)[\"\']', 'stroke=\"#388bfd\" stroke-width=\"2\"', content, flags=re.IGNORECASE)
          content = re.sub(r'stroke:\s*#(000000|000|333333|666666|cccccc|ccc)', 'stroke: #388bfd; stroke-width: 2px', content, flags=re.IGNORECASE)

          # 4. Ubah teks bulan/hari jadi terang (#c9d1d9)
          content = re.sub(r'fill=[\"\']#(000000|000)[\"\']', 'fill=\"#c9d1d9\"', content, flags=re.IGNORECASE)
          content = re.sub(r'fill:\s*#(000000|000)', 'fill: #c9d1d9', content, flags=re.IGNORECASE)

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      # 3. Push hasil SVG
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
