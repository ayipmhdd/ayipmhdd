name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man Bawaan (Versi Asli yang Lengkap Garis Labirinnya)
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Inversi Warna SVG Secara Sempurna Menggunakan Filter CSS Internal
      - name: invert SVG colors for dark mode
        run: |
          python3 -c "
          file_path = 'dist/pacman-contribution-graph.svg'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # Injeksi style filter invert langsung ke elemen <svg> utama
          # filter: invert(0.92) hue-rotate(180deg) akan membalikkan elemen putih ke gelap
          # dan menjaga kontras garis labirin serta warna hantu/pacman
          dark_style = '<style>rect, path, line, text { filter: invert(0.92) hue-rotate(180deg); }</style>'
          
          # Masukkan style tepat di awal tag SVG
          content = content.replace('</svg>', f'{dark_style}</svg>')

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      # 3. Push hasil SVG
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
