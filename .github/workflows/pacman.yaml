name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Suntikkan CSS khusus untuk Dark Mode
      - name: inject custom dark mode styles into SVG
        run: |
          # Bikin string CSS khusus dark mode
          DARK_STYLE="<style> \
            svg { background: transparent !important; } \
            rect[fill='#ffffff'], rect[fill='#FFF'], rect[fill='#ebedf0'], rect[fill='#f0f0f0'], .day { fill: #161b22 !important; stroke: #0d1117 !important; } \
            path, line { stroke: #388bfd !important; stroke-width: 2px !important; } \
            text { fill: #c9d1d9 !important; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif !important; } \
          </style>"
          
          # Inject CSS tersebut tepat sebelum tag penutup </svg>
          sed -i "s|</svg>|${DARK_STYLE}</svg>|g" dist/pacman-contribution-graph.svg

      # 3. Push hasil SVG
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
