name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Dark Mode Color Conversion + Maze Line Fix
      - name: dark mode color conversion
        run: |
          python3 << 'DARKMODE_SCRIPT'
          import re

          file_path = 'dist/pacman-contribution-graph.svg'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # =================================================================
          # GLOBAL COLOR MAP: light-mode hex -> dark-mode hex
          # Replaces colors everywhere: static attrs, animate values, CSS.
          # Green contribution levels are NOT in the map -> preserved.
          # =================================================================
          COLOR_MAP = {
              '#ebedf0': '#161b22',   # empty day boxes -> dark grid cell
              '#f0f0f0': '#161b22',
              '#eeeeee': '#161b22',
              '#e1e4e8': '#161b22',
              '#d1d5da': '#161b22',
              '#c6c6c6': '#161b22',
              '#ffffff': '#0d1117',   # pure white -> dark background
              '#fff':    '#0d1117',
          }

          # --- 1. Replace all mapped colors globally (case-insensitive) ---
          for old_color, new_color in COLOR_MAP.items():
              content = re.sub(re.escape(old_color), new_color, content, flags=re.IGNORECASE)

          # --- 2. Replace CSS/SVG 'white' keyword and rgb() variants ---
          content = re.sub(r'\bwhite\b', '#0d1117', content, flags=re.IGNORECASE)
          content = re.sub(r'rgb\(\s*255\s*,\s*255\s*,\s*255\s*\)', '#0d1117', content)
          content = re.sub(r'rgb\(\s*235\s*,\s*237\s*,\s*240\s*\)', '#161b22', content)
          content = re.sub(r'rgb\(\s*240\s*,\s*240\s*,\s*240\s*\)', '#161b22', content)

          # --- 3. Shrink cells from 20x20 -> 16x16 (+2 offset) = 3px gap each side ---
          # Native GitHub cells also have visible gap between them.
          def shrink_cell(m):
              return f'{m.group(1)} x="{int(m.group(2))+2}" y="{int(m.group(3))+2}" width="16" height="16"'
          content = re.sub(
              r'(<rect\s+id="c-\d+-\d+") x="(\d+)" y="(\d+)" width="20" height="20"',
              shrink_cell,
              content
          )

          # --- 4. Maze wall rects use fill="#000000" (black on dark = invisible) ---
          # Safe global replace: #000000 only appears in wh-*/wv-* wall rects.
          # Sprites are base64 PNG images and are not affected by this.
          content = content.replace('#000000', '#388bfd')  # bright GitHub blue
          content = content.replace('#000', '#388bfd')     # shorthand variant

          # --- 5. Fix text labels: color + GitHub native font ---
          content = re.sub(
              r'(<text[^>]+fill=")(?:#57606a|#000000|#000|#333333|#333)(")',
              r'\1#c9d1d9\2',
              content,
              flags=re.IGNORECASE
          )
          # Inject GitHub native font-family on all text elements
          # Use single quotes for 'Segoe UI' to avoid breaking XML attribute syntax
          GITHUB_FONT = "-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          content = re.sub(
              r'(<text\b)',
              r'\1 font-family="' + GITHUB_FONT + '"',
              content
          )

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(content)

          print('Dark mode conversion complete.')
          DARKMODE_SCRIPT

      # 3. Push Hasil SVG
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
