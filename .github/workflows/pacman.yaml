name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Generate SVG Pac-Man bawaan
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # 2. Bedah total style SVG untuk Dark Mode
      - name: customize SVG colors for github dark mode
        run: |
          # 1. Hapus background canvas putih
          sed -i 's/fill="#ffffff"/fill="none"/g' dist/pacman-contribution-graph.svg
          sed -i 's/fill="#FFF"/fill="none"/g' dist/pacman-contribution-graph.svg
          
          # 2. Matikan SEMUA border putih/terang pada kotak kontribusi
          sed -i 's/stroke="#ebedf0"/stroke="#161b22"/g' dist/pacman-contribution-graph.svg
          sed -i 's/stroke="#e1e4e8"/stroke="#161b22"/g' dist/pacman-contribution-graph.svg
          sed -i 's/stroke="#d1d5da"/stroke="#161b22"/g' dist/pacman-contribution-graph.svg
          sed -i 's/stroke="#ffffff"/stroke="#161b22"/g' dist/pacman-contribution-graph.svg
          
          # 3. Ubah isi kotak kosong yang putih/terang menjadi warna gelap GitHub (#161b22)
          sed -i 's/fill="#ebedf0"/fill="#161b22"/g' dist/pacman-contribution-graph.svg
          sed -i 's/fill="#f0f0f0"/fill="#161b22"/g' dist/pacman-contribution-graph.svg
          sed -i 's/fill="#eeeeee"/fill="#161b22"/g' dist/pacman-contribution-graph.svg
          
          # 4. Bikin garis labirin (path/lines) berwarna Biru Neon (#388bfd) tebal biar jelas
          sed -i 's/stroke="#000000"/stroke="#388bfd" stroke-width="2"/g' dist/pacman-contribution-graph.svg
          sed -i 's/stroke="#000"/stroke="#388bfd" stroke-width="2"/g' dist/pacman-contribution-graph.svg
          sed -i 's/stroke="#333333"/stroke="#388bfd" stroke-width="2"/g' dist/pacman-contribution-graph.svg
          sed -i 's/stroke="#666666"/stroke="#388bfd" stroke-width="2"/g' dist/pacman-contribution-graph.svg
          
          # 5. Ubah warna teks bulan & hari menjadi terang (#c9d1d9)
          sed -i 's/fill="#000000"/fill="#c9d1d9"/g' dist/pacman-contribution-graph.svg
          sed -i 's/fill="#000"/fill="#c9d1d9"/g' dist/pacman-contribution-graph.svg

      # 3. Push hasil SVG ke branch output
      - name: push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
