git commit -m "feat: upgrade wakatime workflow to visual SVG card generator"name: WakaTime Visual Stats Generator

on:
  schedule:
    # Jalan otomatis setiap malam jam 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Biar bisa di-run manual kapan aja

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          SHOW_LINES_OF_CODE: "true"
          SHOW_PROFILE_VIEWS: "false"
          SHOW_DAYS_OF_WEEK: "true"
          SHOW_SHORT_INFO: "true"
          SHOW_LOC_CHART: "true"
          SHOW_PROJECTS: "true"
          SECTION_NAME: "waka"
