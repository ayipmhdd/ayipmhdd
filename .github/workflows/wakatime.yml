name: WakaTime Readme Stats

on:
  schedule:
    # Jalan otomatis setiap malam jam 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TIME: true
          SHOW_MASKED_TIME: true
          SHOW_HIERARCHY: true
