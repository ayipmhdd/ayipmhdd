name: WakaTime Visual Stats Generator

on:
  schedule:
    # Jalan otomatis setiap malam jam 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Biar bisa di-run manual kapan aja

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_LOC_CHART: "True"
          SHOW_PROJECTS: "True"
          SECTION_NAME: "waka"
